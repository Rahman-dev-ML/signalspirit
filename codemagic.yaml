# Signal Sprint — Capacitor 8 iOS (App Store / TestFlight)
# Bundle ID must match Android: com.thelunox.signalsprint

workflows:
  signal-sprint-ios:
    name: Signal Sprint iOS (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thelunox.signalsprint
      vars:
        BUNDLE_ID: "com.thelunox.signalsprint"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6834041714
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Build web and sync Capacitor iOS
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || true)
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" = "null" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          fi
          agvtool new-version -all "$UPDATED_BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          find "$CM_BUILD_DIR" -type f -name "*.ipa" -print
          find "$CM_BUILD_DIR" -type f -name "*.ipa" -exec cp -f {} "$CM_BUILD_DIR/build/ios/ipa/" \;
          ls -la "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/**/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
